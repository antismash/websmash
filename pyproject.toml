[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "websmash"
version = "0.2.0"
description = "REST-like API powering the antiSMASH web service"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Kai Blin" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "Flask>=3.1",
    "Flask-Mail>=0.10",
    "redis",
    "antismash-models>=0.1.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4",
    "pytest-flask",
    "coverage",
    "pytest-cov>=6",
    "MiniMock==1.2.8",
    "Flask-Testing",
    "fakeredis",
    "pytest-mock",
    "flake8>=7",
]

[project.urls]
Homepage = "https://github.com/antismash/websmash"
Repository = "https://github.com/antismash/websmash"

[tool.pytest.ini_options]
filterwarnings = ["error"]

[tool.setuptools.packages.find]
include = ["websmash*"]
